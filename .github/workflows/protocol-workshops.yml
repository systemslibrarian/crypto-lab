name: Protocol workshops
on:
  # workflow_dispatch so a pull request opened by a job can REQUEST this check.
  # `gh pr create` authenticated as secrets.GITHUB_TOKEN raises no pull_request
  # event, so a job-opened pull request reports only the checks that run on
  # push -- four security scans out of sixteen on crypto-lab#467, with
  # `gh pr checks` reporting green because what reported was green (#468).
  # GITHUB_TOKEN MAY raise workflow_dispatch, so the job raises the missing
  # workflows itself against the pull request's own ref, and the check runs land
  # on that head SHA. Nothing about what this workflow checks changes.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cryptographic negative controls and reading-path integrity
        run: node --test learn/secure-message/model.test.mjs tests/protocol-workshops.test.mjs tests/fair-exchange-optimistic.test.mjs tests/reading-path.test.mjs tests/understanding-cryptography.test.mjs
      - name: Timestamp batching and renewal mutation controls
        run: node learn/timestamping/mutations.mjs
      - name: Optimistic fair-exchange mutation controls
        run: node learn/fair-exchange/mutations.mjs
      - run: npm ci
        working-directory: tools
      - run: npx playwright install chromium
        working-directory: tools
      - name: Real browser interactions, keyboard access and responsive layout
        run: node --test --test-timeout=180000 tests/protocol-workshops-browser.test.cjs
