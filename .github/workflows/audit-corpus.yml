# Audit corpus: regenerate corpus/ so an external auditor can read every lab from
# one fetch, and fail if any carded lab is absent from it.
#
# SCHEDULED, because the corpus describes the LABS and the labs move on days this
# repository sees no activity. The same reason fleet.yml is scheduled: a pin, a
# claim or a README can change in a lab while nothing here is committed. A corpus
# refreshed only on catalog changes would describe the fleet as it was.
#
# IT NEVER PUSHES TO main. A scheduled run that changed a published file without
# review would deploy 13 MB of generated prose to the live site on no one's
# authority. It pushes the refresh to one branch and asks a person to review it,
# so a person approves what the auditors will read. The hard FAILURE is reserved
# for the thing that makes the corpus wrong rather than stale: a lab in the
# registry with no record.
#
# It OPENS THE PULL REQUEST, and keeps filing an issue as the fallback. The
# create used to be refused outright -- "GitHub Actions is not permitted to
# create or approve pull requests" -- because Settings -> Actions ->
# "Allow GitHub Actions to create and approve pull requests" was off. That
# setting was turned on 2026-11-12, so the create is attempted first and the
# reused issue is what happens if it is ever refused again. Both paths are kept
# because the setting is a repository setting and can be turned back off.
#
# The generator only READS the labs. That is asserted rather than claimed: the
# last step re-checks every cloned lab for modifications and fails if any is
# dirty, so a future edit to the generator cannot start writing into a lab
# without this job going red.
name: Audit corpus

on:
  schedule:
    # WEEKLY, Monday 06:17 UTC. It was daily, and daily was the wrong cadence for
    # what this job actually produces: a refresh nobody merges. The corpus moves
    # when a LAB moves, the labs move in the Monday Dependabot wave, and a daily
    # run spent 252 clones and a 13 MB regeneration six days out of seven to
    # re-propose a branch that was already waiting. Monday 06:17 is after that
    # wave and before the 06:17 fleet check it used to shadow.
    #
    # The daily cadence was also doing the asking badly: one reused issue, bumped
    # every day, reads as noise rather than as a queue.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # The push trigger on catalog paths is GONE. It fired on every landed catalog
  # change and rebuilt the whole corpus to discover, almost always, that no lab
  # had moved -- the corpus describes the labs, not this repository, so a change
  # here is the one thing that cannot make it stale. The pre-flight below now
  # answers that question in seconds instead, and the pull_request trigger is
  # kept because verifying a proposed catalog change is a different job from
  # proposing a refresh.
  pull_request:
    paths:
      - 'index.html'
      - 'tools/catalog-reviewed.json'
      - 'tools/card-reader.js'
      - 'tools/lab-pages.js'
      - 'scripts/build-audit-corpus.js'
      - 'scripts/corpus-readme.md'

permissions:
  contents: write
  pull-requests: write   # read open pull requests; it cannot CREATE one, see below
  issues: write

concurrency:
  group: audit-corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # PRE-FLIGHT. Ask whether any lab moved before spending 252 clones and a
      # 13 MB regeneration to find out.
      #
      # ls-remote, NOT the REST API. Each answer is one ref advertisement over
      # https and costs nothing from the hourly REST quota, which this fleet's
      # refresh already needs 4308 calls of per pass; 252 REST reads a week on
      # top of that is a cost with no return. ls-remote is also the right
      # question: it asks the remote what its HEAD is, which is exactly what the
      # corpus records per lab.
      #
      # The baseline is the corpus ON MAIN -- corpus/labs.jsonl already carries
      # `commit_sha` per lab, "the commit whose bytes each record was read from".
      # Nothing new had to be recorded for this.
      #
      # FAIL-CLOSED on not knowing. A lab whose ls-remote fails, and a carded lab
      # with no record in the corpus at all, both count as MOVED. Treating either
      # as unchanged would let the job report "no lab changed" on the strength of
      # a question it could not ask, which is the one answer it must never give.
      - name: Ask every lab whether it moved
        id: preflight
        run: |
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync("corpus/labs.jsonl", "utf8").split("\n").filter(Boolean);
            for (const line of rows) {
              const d = JSON.parse(line);
              if (d.slug) console.log(`${d.slug} ${d.commit_sha || "none"}`);
            }
          ' | sort > /tmp/corpus-shas.txt
          echo "labs recorded in the corpus on main: $(wc -l < /tmp/corpus-shas.txt)"
          corpus_date=$(node -e 'console.log(require("./corpus/index.json").generated_at)')
          echo "corpus_date=$corpus_date" >> "$GITHUB_OUTPUT"

          # Parallel, because 252 sequential ref reads is minutes of wall clock.
          cut -d" " -f1 /tmp/corpus-shas.txt | xargs -P 12 -I{} sh -c \
            'sha=$(git ls-remote "https://github.com/systemslibrarian/{}.git" HEAD 2>/dev/null | cut -f1);
             printf "%s %s\n" "{}" "${sha:-UNREADABLE}"' | sort > /tmp/remote-heads.txt

          join /tmp/corpus-shas.txt /tmp/remote-heads.txt > /tmp/joined.txt
          awk '$2 != $3 { print }' /tmp/joined.txt > /tmp/moved.txt
          awk '$3 == "UNREADABLE" { print $1 }' /tmp/joined.txt > /tmp/unreadable.txt
          # A carded lab the corpus has no record of is a lab this job has never
          # read. --check fails the job on it later; here it must force a build.
          comm -13 <(cut -d" " -f1 /tmp/corpus-shas.txt) <(cut -d" " -f1 /tmp/remote-heads.txt) > /tmp/new.txt || true

          moved=$(wc -l < /tmp/moved.txt | tr -d " ")
          unread=$(wc -l < /tmp/unreadable.txt | tr -d " ")
          echo "moved=$moved unreadable=$unread"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

          if [ "$moved" -eq 0 ]; then
            {
              echo "### Audit corpus"
              echo
              echo "**no lab changed since $corpus_date** — nothing was built and nothing was pushed."
              echo
              echo "Checked $(wc -l < /tmp/remote-heads.txt | tr -d " ") labs by \`git ls-remote\`, against the \`commit_sha\` each one carries in \`corpus/labs.jsonl\` on main. No REST quota was spent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no lab changed since $corpus_date"
            exit 0
          fi

          {
            echo "### Audit corpus"
            echo
            echo "**$moved lab(s) moved since $corpus_date.** Rebuilding."
            echo
            echo "| lab | corpus commit | remote HEAD |"
            echo "|---|---|---|"
            awk '{ printf "| `%s` | `%s` | `%s` |\n", $1, substr($2,1,12), substr($3,1,12) }' /tmp/moved.txt | head -60
            [ "$moved" -gt 60 ] && echo "" && echo "_(first 60 of $moved)_"
            if [ "$unread" -gt 0 ]; then
              echo
              echo "**$unread lab(s) could not be read** and are counted as moved, because a question this job could not ask is not an answer of \"unchanged\":"
              echo
              sed 's/^/- `/; s/$/`/' /tmp/unreadable.txt | head -20
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/  moved: /' /tmp/moved.txt | head -20

      # The corpus is read out of the lab checkouts, so the labs have to be on
      # disk beside this repo. Same list and same declared exclusion as
      # fleet.yml: local runs and this job must not disagree about who is in the
      # fleet, which is why both read tools/non-exhibit-repos.json rather than
      # each filtering by prefix.
      - name: Clone the fleet beside this repo
        if: steps.preflight.outputs.moved != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list systemslibrarian --limit 400 --json name \
            --jq '.[] | select(.name | startswith("crypto-lab-")) | .name' > /tmp/labs.txt
          node -e '
            const d = require("./tools/non-exhibit-repos.json");
            console.log((d.excluded || []).map((e) => e.repo).join("\n"));
          ' > /tmp/non-exhibit.txt
          if [ -s /tmp/non-exhibit.txt ]; then
            grep -vxF -f /tmp/non-exhibit.txt /tmp/labs.txt > /tmp/labs.kept || true
            mv /tmp/labs.kept /tmp/labs.txt
            echo "declared non-subjects dropped from the clone list:"
            sed 's/^/  /' /tmp/non-exhibit.txt
          fi
          echo "labs to clone: $(wc -l < /tmp/labs.txt)"
          xargs -P 8 -I{} sh -c \
            'git clone --depth 1 --quiet "https://github.com/systemslibrarian/{}.git" "../{}" \
              || echo "::warning::clone failed: {}"' < /tmp/labs.txt
          echo "clones on disk: $(ls -1d ../crypto-lab-* 2>/dev/null | wc -l)"

      # A record of what every lab looked like BEFORE the generator ran, so the
      # read-only claim can be checked afterwards rather than asserted.
      - name: Record each clone's state before generating
        if: steps.preflight.outputs.moved != '0'
        run: |
          for d in ../crypto-lab-*; do
            [ -d "$d/.git" ] || continue
            printf '%s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD)"
          done | sort > /tmp/before.txt
          wc -l < /tmp/before.txt

      - name: Generate the corpus
        if: steps.preflight.outputs.moved != '0'
        run: node scripts/build-audit-corpus.js

      # The hard gate. Not "is the corpus stale" -- that produces a pull request
      # below -- but "is a carded lab absent from it", which makes every count in
      # the corpus a lie about a denominator nobody declared.
      - name: Fail if any carded lab is missing from the corpus
        id: hardgate
        if: steps.preflight.outputs.moved != '0'
        run: node scripts/build-audit-corpus.js --check

      - name: Guard tests
        id: guards
        if: steps.preflight.outputs.moved != '0'
        run: node --test tests/audit-corpus.test.cjs

      # The read-only property, asserted. If a future change to the generator
      # starts writing into a lab, this is what goes red.
      - name: Assert no lab repository was modified
        id: readonly
        if: steps.preflight.outputs.moved != '0'
        run: |
          fail=0
          for d in ../crypto-lab-*; do
            [ -d "$d/.git" ] || continue
            dirty=$(git -C "$d" status --porcelain | wc -l | tr -d ' ')
            if [ "$dirty" -ne 0 ]; then
              echo "::error::$(basename "$d") was modified by this job ($dirty path(s))"
              fail=1
            fi
          done
          for d in ../crypto-lab-*; do
            [ -d "$d/.git" ] || continue
            printf '%s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD)"
          done | sort > /tmp/after.txt
          if ! diff -u /tmp/before.txt /tmp/after.txt; then
            echo "::error::a lab's HEAD moved during this job"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "every lab checkout is byte-clean and at the commit it started on"
          exit "$fail"

      - name: Report
        if: steps.preflight.outputs.moved != '0'
        run: |
          node -e '
            const i = require("./corpus/index.json");
            console.log("registry cards :", i.registry.cards);
            console.log("corpus records :", i.lab_count);
            console.log("complete       :", i.complete);
            console.log("clones behind  :", i.clones_behind_remote.length);
            console.log("missing fields :", i.labs_with_missing_fields.length, "lab(s)");
            for (const [f, n] of Object.entries(i.missing_field_totals)) console.log("   ", String(n).padStart(4), f);
            const mb = i.files.reduce((n, f) => n + f.bytes, 0) / 1024 / 1024;
            console.log("total size     :", mb.toFixed(2), "MB across", i.files.length, "file(s)");
          '

      # Only a refresh proposes anything, and only off a schedule, a manual run
      # or a landed catalog change. A pull_request run verifies and stops: it has
      # no business proposing a change to the branch it is checking.
      #
      # IT FILES AN ISSUE INSTEAD OF OPENING THE PULL REQUEST, and that is a
      # constraint rather than a preference. `gh pr create` with
      # secrets.GITHUB_TOKEN is refused outright on this repository --
      # "GitHub Actions is not permitted to create or approve pull requests
      # (createPullRequest)" -- because /actions/permissions/workflow reports
      # can_approve_pull_request_reviews: false, and that one setting governs
      # creation as well as approval. Measured 2026-11-09 on the first run after
      # this workflow landed on main: every step up to this one passed, the
      # refresh branch pushed, and the job failed on the create.
      #
      # Enabling that setting is the maintainer's call, not a workflow's, so the
      # refresh is pushed to its branch and a person is told in the one place this
      # repository already uses for unattended findings. Same discipline as
      # fleet.yml: ONE issue, reused and updated, never a second, and it closes
      # nothing -- a refresh landing is a person's decision. The first-proposed
      # date is carried forward out of the existing body, so a refresh that has
      # been waiting a month reads as one that has been waiting a month.
      #
      # A `|| echo "::warning::"` here would be the dispatch defect this fleet
      # already has a checker for: the step would exit 0 having said nothing a
      # person reads. The branch push and the issue write are both unguarded, so
      # either failing fails the job.
      - name: Push the refresh and ask for review
        if: github.event_name != 'pull_request' && steps.preflight.outputs.moved != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARDGATE: ${{ steps.hardgate.outcome }}
          GUARDS: ${{ steps.guards.outcome }}
          READONLY: ${{ steps.readonly.outcome }}
        run: |
          # `git diff` is blind to an untracked path, and on a fresh checkout
          # corpus/ may be entirely untracked -- the first run would have
          # reported "already current" and proposed nothing. Ask status, which
          # sees untracked files, and stage first so the comparison is real.
          git add -A -- corpus llms.txt
          branch=corpus/auto-refresh
          if git diff --cached --quiet -- corpus llms.txt; then
            # Labs moved but the corpus did not: the movement touched nothing the
            # corpus records. Nothing to propose -- and if a refresh branch is
            # still sitting on origin carrying nothing main lacks, it is stale
            # rather than pending, so retire it instead of leaving a branch that
            # looks like an open proposal.
            echo "corpus is already current; nothing to propose"
            remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            if [ -n "$remote_sha" ]; then
              if git diff --quiet "$remote_sha" HEAD -- corpus llms.txt 2>/dev/null; then
                git push origin --delete "$branch" \
                  && echo "deleted stale $branch ($remote_sha); it carried nothing main lacks"
                echo "- retired stale \`$branch\` (\`${remote_sha:0:12}\`): nothing on it that main lacks" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$branch still differs from main; left alone for review"
              fi
            fi
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "Refresh the audit corpus" \
            -m "Regenerated by .github/workflows/audit-corpus.yml. The corpus describes the LABS, so it drifts when a lab moves rather than when this repository changes. commit_sha in each record is the commit its bytes were read from, not the branch tip."
          # The LEASE HAS TO BE PINNED, because this job checks out --depth 1 of
          # main and therefore has no refs/remotes/origin/$branch to lease
          # against. A bare --force-with-lease then refuses with
          # "! [rejected] ... (stale info)" -- not when the branch is new, which
          # is why the first run pushed and the second did not. Reproduced
          # against real git in a bare repository plus a depth-1 clone, both
          # ways, before this was written.
          #
          # ls-remote reads what is actually there and the lease pins it, so this
          # is still a lease and not a bare --force: if anything moves the branch
          # between the read and the push, the push is refused. That direction is
          # asserted in the same reproduction rather than assumed.
          remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi

          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open_pr" ]; then
            echo "pull request #$open_pr is already open for $branch; it now carries this refresh"
            echo "- refresh pushed to \`$branch\`; pull request #$open_pr already open and now carries it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Open it. This was refused until Settings -> Actions ->
          # "Allow GitHub Actions to create and approve pull requests" was turned
          # on (2026-11-12); the reused issue below is kept as the fallback
          # because that setting can be turned back off, and a refresh nobody is
          # told about is the failure this step exists to prevent.
          moved_list=$(awk '{ printf "- `%s` `%s` -> `%s`\n", $1, substr($2,1,12), substr($3,1,12) }' /tmp/moved.txt | head -60)
          # Built with a heredoc rather than a multi-line shell string: an
          # unindented continuation line inside a `run: |` block ends the block
          # scalar and the workflow stops parsing.
          nmoved=$(wc -l < /tmp/moved.txt | tr -d " ")
          {
            printf 'Regenerated by `.github/workflows/audit-corpus.yml` from [run %s](https://github.com/%s/actions/runs/%s).\n\n' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s lab(s) moved since the corpus on main was generated:\n\n' "$nmoved"
            awk '{ printf "- `%s` `%s` -> `%s`\n", $1, substr($2,1,12), substr($3,1,12) }' /tmp/moved.txt | head -60
            [ "$nmoved" -gt 60 ] && printf '\n_(first 60 of %s)_\n' "$nmoved"
            printf '\n`commit_sha` in each record is the commit its bytes were read from, not the branch tip. Review the counts in `corpus/index.json` before merging.\n'
          } > /tmp/pr-body.md
          if pr_url=$(gh pr create --head "$branch" --base main \
                --title "Refresh the audit corpus" --body-file /tmp/pr-body.md 2>/tmp/prerr.txt); then
            echo "opened $pr_url"
            echo "- opened $pr_url for \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            # AUTO-MERGE, but only for the refresh this job is allowed to make.
            #
            # The bottleneck was never the cadence: on 2026-11-12 the first weekly
            # run found 226 of 252 labs moved, because the DAILY job had been
            # proposing a refresh every day that nobody merged. Regenerated prose
            # and a moved `commit_sha` do not need a person; something outside
            # corpus/ does, and that is the whole of the condition.
            #
            # Three things must already have passed, and they are named rather
            # than assumed: the hard gate (--check: no carded lab absent from the
            # corpus), the guard tests, and the read-only assertion that no lab
            # checkout was modified. If any had failed the job would have stopped
            # before this step, but naming them means a future reordering cannot
            # quietly auto-merge a refresh whose gates did not run.
            #
            # Confinement is computed from the STAGED diff, which is what was
            # committed, not from the generator's intentions. llms.txt is staged
            # alongside corpus/ and is therefore OUTSIDE it: a refresh that moves
            # llms.txt is left for a person, by this rule, deliberately.
            outside=$(git diff --name-only HEAD~1 HEAD | grep -v '^corpus/' || true)
            if [ -n "$outside" ]; then
              echo "::notice::not auto-merging; the refresh touches path(s) outside corpus/"
              {
                echo "- **left for review**: $pr_url touches path(s) outside \`corpus/\`:"
                printf '%s\n' "$outside" | sed 's/^/    - `/; s/$/`/'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "${HARDGATE}" != "success" ] || [ "${GUARDS}" != "success" ] || [ "${READONLY}" != "success" ]; then
              echo "::notice::not auto-merging; a gate did not report success (hardgate=$HARDGATE guards=$GUARDS readonly=$READONLY)"
              echo "- **left for review**: $pr_url — a gate did not report success" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr merge --auto --squash "$pr_url" \
              && echo "- auto-merge enabled on $pr_url (confined to \`corpus/\`, all three gates passed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice::gh pr create was refused; falling back to the reused issue"
          sed 's/^/  /' /tmp/prerr.txt | head -4

          title="Audit corpus refresh is waiting for review"
          # Exact title match over the open issues rather than `--search`, whose
          # index lags: a lagging search opens a second issue, which is the one
          # outcome the reuse rule exists to prevent.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          since=$(date -u +%Y-%m-%d)
          if [ -n "$number" ]; then
            prior=$(gh issue view "$number" --json body --jq .body \
              | sed -n 's/^First proposed: \([0-9-]*\).*/\1/p' | head -1)
            [ -n "$prior" ] && since="$prior"
          fi

          summary=$(node -e '
            const i = require("./corpus/index.json");
            const mb = (i.files.reduce((n, f) => n + f.bytes, 0) / 1024 / 1024).toFixed(2);
            console.log(`${i.lab_count} records of ${i.registry.cards} cards, ${mb} MB across ${i.files.length} file(s), complete=${i.complete}, ${i.clones_behind_remote.length} clone(s) behind their remote.`);
          ')

          body=$(cat <<EOF
          The weekly run regenerated \`corpus/\` and it differs from \`main\`. The refresh is on
          [\`$branch\`](https://github.com/$GITHUB_REPOSITORY/compare/main...$branch) — **open a pull request from that branch** to land it.

          $summary

          First proposed: $since
          Last refreshed: $(date -u +%Y-%m-%dT%H:%M:%SZ) by [run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          \`commit_sha\` in each record is the commit its bytes were read from, not the branch tip. Review the counts in \`corpus/index.json\` before merging.

          This issue is the FALLBACK. The workflow tries to open the pull request itself and only files this when the create is refused -- which happens when **Settings → Actions → "Allow GitHub Actions to create and approve pull requests"** is off. If you are reading this issue, check that setting first.

          Reused rather than reopened, and closed by a person — a passing run is not the same as a refresh having been reviewed.
          EOF
          )
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
            echo "updated issue #$number (waiting since $since)"
          else
            gh issue create --title "$title" --body "$body"
          fi
