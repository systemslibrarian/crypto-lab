# Fleet check: the nine checkers that ask the fleet rather than this repository.
#
# These are scheduled because their answers change without anyone committing here — a
# lab can start serving a stale build, be published with no card, or invalidate a
# pinned catalog source review on a day this repo sees no activity. Every other checker compares
# files that only move when someone moves them, and those run on pull_request.
#
# DAILY, and it was weekly until 2026-11-05. The reason travels with the number, because
# the old reason was reasonable and was wrong: "a daily run is a lot of noise for a
# question whose answer moves slowly". The answer does not move slowly while a merge
# round is running. On 2026-10-23 an owner campaign rewrote the Dependabot merge step on
# thirteen labs' BRANCHES, reintroducing the `gh pr view` re-query that tools/transform.mjs
# had removed from ~179 labs on 2026-09-10 — the one construct dispatch-sync exists to
# catch. Those branches reached main on 2026-11-03 and 11-04. The last weekly run was
# 2026-11-02, so the sweep was green at its last look and the next one was 2026-11-09:
# a six-day window in which thirteen labs could not ship a self-merged bump and nothing
# said so. It was found by hand instead.
#
# The noise argument does not survive contact with the runner either: fleet-check.js
# REUSES one open issue and never opens a second, so a standing failure costs one issue
# whatever the cadence, and the "failing since" date keeps counting. The run is 4 to 9
# minutes. Daily turns a six-day blind window into a one-day one for the price of one
# scheduled run.
#
# This does not block a merge. The only thing that can is a lab's own CI, and 29 of the
# 253 labs already assert their merge step in a workflow-controls test — the five that
# had one caught the 2026-11-05 repair the minute it landed. Extending that to the other
# 224 is the stronger guard and is the maintainer's call: it is 224 new files and 253
# copies of one assertion to keep in step, against one cron line here.
name: Fleet check

on:
  schedule:
    - cron: '41 7 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-check
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # theme-sync reads every page of every lab, so the labs have to be here. The
      # others ask the API. Cloning the fleet is the slow part of this job, not the
      # checks, which is the other reason it runs weekly rather than daily.
      # gate-sync, dispatch-sync and theme-sync read the labs' own files, so the labs
      # have to be on disk beside this repo, which is where those checkers look. The
      # other three ask the API. Cloning is the slow part of this job, not the checks —
      # the other reason it runs weekly rather than daily. Shallow and parallel; a
      # clone that fails is a warning and a missing lab, which dispatch-census reports
      # by name rather than quietly shrinking anyone's denominator.
      - name: Clone the fleet beside this repo
        run: |
          # The list is every crypto-lab-* repo PLUS anything the census pins that does
          # not carry that prefix. Filtering on the prefix alone left crypto-compare and
          # crypto-counsel uncloned, and dispatch-sync reported them as NOT-CLONED — a
          # finding about this workflow's clone step, reported as if it were about the
          # labs. A checker's denominator is the pin, so the clone has to cover the pin.
          gh repo list systemslibrarian --limit 400 --json name \
            --jq '.[] | select(.name | startswith("crypto-lab-")) | .name' > /tmp/labs.txt
          node -e '
            const c = require("./tools/dispatch-census.json");
            const pinned = new Set();
            for (const v of Object.values(c)) if (Array.isArray(v)) for (const n of v) if (typeof n === "string") pinned.add(n);
            for (const n of [...pinned].sort()) if (!n.startsWith("crypto-lab-") && n !== "crypto-lab") console.log(n);
          ' >> /tmp/labs.txt
          sort -u /tmp/labs.txt -o /tmp/labs.txt
          # Drop declared non-subjects, from the SAME file tools/sibling-labs.js reads,
          # so local runs and this job cannot disagree about who is in the fleet.
          #
          # This step excluded the owner's private Fleet Console only because
          # secrets.GITHUB_TOKEN is scoped to this repository and cannot list the
          # owner's private repos -- an accident of token visibility, not a rule.
          # Measured 2026-11-08: the `gh repo list` filter above DOES return
          # crypto-lab-fleet when run with a credential that can see it. So the
          # moment this job gained a wider token it would start cloning a console
          # that is not an exhibit, and five checkers would file findings about it.
          node -e '
            const d = require("./tools/non-exhibit-repos.json");
            console.log((d.excluded || []).map((e) => e.repo).join("\n"));
          ' > /tmp/non-exhibit.txt
          if [ -s /tmp/non-exhibit.txt ]; then
            grep -vxF -f /tmp/non-exhibit.txt /tmp/labs.txt > /tmp/labs.kept || true
            mv /tmp/labs.kept /tmp/labs.txt
            echo "declared non-subjects dropped from the clone list:"
            cat /tmp/non-exhibit.txt | sed 's/^/  /'
          fi
          wc -l < /tmp/labs.txt
          xargs -P 8 -I{} sh -c \
            'git clone --depth 1 --quiet "https://github.com/systemslibrarian/{}.git" "../{}" \
              || echo "::warning::clone failed: {}"' < /tmp/labs.txt
          ls -1d ../crypto-lab-* | wc -l

          # A --depth 1 clone does not contain the commit a source review is pinned
          # to, so catalog-evidence cannot ask whether that lab has moved since. It
          # used to answer the unanswerable question with "moved": on 2026-10-01 this
          # job reported STALE-REVIEW for 27 labs and failed, while the same checkers
          # on full clones reported none. The checker now reports PIN-UNREADABLE for
          # that case instead of inventing a re-review queue -- and this step removes
          # the case, by fetching each pinned commit into its shallow clone. One
          # object-ish fetch per reviewed lab, about thirty of them, which is far
          # cheaper than cloning the fleet deep.
          #
          # Fetching only `commit` was the same defect one field along. A pin also
          # carries `range: "<from>..<to>"`, and the range check diffs BOTH endpoints;
          # with the start absent the diff dies and the run reports RANGE-UNREADABLE,
          # which is a fact about this clone step and not about the lab. The 2026-11-07
          # run printed "fatal: Invalid revision range" for ten labs that way. So fetch
          # every endpoint a pin names, not just the one the pin ends at.
          node -e '
            const r = require("./tools/catalog-reviewed.json");
            for (const [slug, v] of Object.entries(r)) {
              if (!v) continue;
              const wanted = new Set();
              if (v.commit) wanted.add(v.commit);
              for (const part of String(v.range || "").split(/\.{2,3}/)) wanted.add(part.trim());
              for (const sha of wanted) if (/^[0-9a-f]{40}$/.test(sha)) console.log(slug + " " + sha);
            }
          ' > /tmp/pins.txt
          wc -l < /tmp/pins.txt
          while read -r slug sha; do
            [ -d "../$slug" ] || continue
            git -C "../$slug" cat-file -e "$sha^{commit}" 2>/dev/null && continue
            git -C "../$slug" fetch --depth 1 --quiet origin "$sha" 2>/dev/null \
              || echo "::warning::could not fetch reviewed commit $sha for $slug; catalog-evidence will report PIN-UNREADABLE or RANGE-UNREADABLE for it"
          done < /tmp/pins.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Every network-backed checker, then one issue naming all that failed
        run: node tools/fleet-check.js --open-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # protection-census is one of the checkers above and is the only one that
          # cannot use GH_TOKEN: that secret is scoped to THIS repository, so asking a
          # sibling for its branch protection answers `403 Resource not accessible by
          # integration`. fleet-check.js runs a checker that declares a required
          # credential WITH that credential, so this is the whole of the wiring.
          #
          # If this secret is absent the census is reported NOT RUN, by name, and does
          # not fail the job -- a missing secret here is a configuration gap in this
          # repository, not a finding about 234 labs. A secret that exists and no longer
          # works is the other case and DOES fail: the census asked, was refused, and
          # reports UNREAD. A fine-grained PAT expires, so that case will come.
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

      # ── protection-census joined this job on 2026-10-20 ──
      #
      # It is in CHECKERS in tools/fleet-check.js, not a step of its own, so its failures
      # join the single weekly issue rather than only reddening the job. The note that
      # stood here described why it could NOT be scheduled, and the whole of the reason
      # was the token:
      #
      #   `secrets.GITHUB_TOKEN` is scoped to the repository the workflow runs in, so
      #   reading branch protection on a SIBLING answers 403. That is not a permissions
      #   block `permissions:` above can lift -- the token has no standing in those
      #   repositories at all. The first scheduled run proved it: UNREAD for all 204
      #   labs, filed as a failure.
      #
      # What fixed it is `secrets.FLEET_READ_TOKEN`, a fine-grained PAT whose repository
      # access covers every crypto-lab-* repo, with ONE permission -- Administration:
      # Read-only. Branch protection and repository rulesets both sit under
      # Administration, and read is all the census needs; it is read-only by construction
      # and has no write path. A classic PAT works too but wants `repo`, which carries
      # write to code and settings across everything it can see -- prefer the
      # fine-grained one.
      #
      # Verified against all 234 labs before scheduling: 1 ruleset, 3 classic, 230 none,
      # 0 UNREAD, in 23 seconds. The one ruleset is crypto-lab-privacy-pass, which is the
      # lab this checker exists for -- the classic endpoint answers 404 "Branch not
      # protected" for it while the rules endpoint shows required_status_checks with no
      # bypass actors.
      #
      # A fine-grained PAT EXPIRES. When this one does, the census will report UNREAD and
      # fail this job, which is correct and is the loud half on purpose: it asked and was
      # refused, so it genuinely has no view on those labs. Rotate the secret; do not
      # mute the checker.
