name: Three arcade games
on:
  # workflow_dispatch so a pull request opened by a job can REQUEST this check.
  # `gh pr create` authenticated as secrets.GITHUB_TOKEN raises no pull_request
  # event, so a job-opened pull request reports only the checks that run on
  # push -- four security scans out of sixteen on crypto-lab#467, with
  # `gh pr checks` reporting green because what reported was green (#468).
  # GITHUB_TOKEN MAY raise workflow_dispatch, so the job raises the missing
  # workflows itself against the pull request's own ref, and the check runs land
  # on that head SHA. Nothing about what this workflow checks changes.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  crypto-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: SHA-256, shuffle, and six-mission gameplay tests
        run: node --test tests/arcade-games.test.mjs tests/arcade-flow.test.mjs
      - run: npm ci
        working-directory: tools
      # The hosted image already carries Chromium's system libraries. Running
      # Playwright's apt path here has repeatedly wedged until the job timeout;
      # keep the real browser test below and install only the browser binary.
      - run: npx playwright install chromium
        working-directory: tools
      - name: Play through three games on desktop and mobile viewports
        run: node --test --test-timeout=180000 tests/arcade-browser.test.cjs
