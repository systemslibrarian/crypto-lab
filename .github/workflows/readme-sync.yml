# README catalog: README.md's generated tables (Featured, Learning Paths, All Demos)
# and index.html's hero count must match what tools/readme-sync.js produces from the
# cards. No dependencies: the generator is plain Node.
name: README catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: README.md matches the generator's output
        run: node tools/readme-sync.js check
      # The maintenance table is generated too — from each tool's own header and from
      # the workflow job that runs it — so it drifts the same way the demo tables would
      # if nothing checked them.
      - name: README.md's tools table matches the tools
        run: node tools/tools-sync.js check
      # CATALOG.md is generated from the same cards, and its check does a second job:
      # it fails a card that claims to implement an algorithm without a file:line
      # anchor behind the claim. It needs no clones — the evidence is on the card —
      # so the claim and the check travel together in one pull request.
      - name: CATALOG.md matches the cards, and every claim has its evidence
        run: node tools/catalog-sync.js check
