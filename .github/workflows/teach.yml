# Teach pages: the /teach/ layer and its daily worksheet drift check.
# This is the first workflow in this repository; the site itself is still published by
# GitHub Pages' own build from main, which this workflow does not touch.
name: Teach pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily, for the worksheet drift check
  workflow_dispatch:       # run the drift check by hand

permissions:
  contents: read

concurrency:
  group: teach-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # Generated pages must match their sources, and teach/ must carry no hardcoded
    # catalog counts. No dependencies: the generator is plain Node.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Teach pages match their sources, and the count lint passes
        run: node tools/teach-build.js check

  layout:
    # Line length is a property of the rendered page, so it is measured in a browser.
    # A module page once published its check results in a column about 85px wide, and
    # every file-to-file checker stayed green while it did.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: Issue checker preserves unreadable launch failures
        run: node --test tests/teach-issues.test.cjs
      # No --with-deps: that apt step has wedged CI across this fleet (audits/kickoff.md).
      - run: npx playwright install chromium
        working-directory: tools
      - name: No page scrolls sideways, overflows its container, or crushes prose
        run: node tools/teach-layout.js
      - name: Hub link names and learning-game discovery
        run: node --test tests/hub-accessible-name.test.cjs tests/hub-learning-game.test.cjs
      - name: Knowledge map navigation and responsive layout
        run: node tools/knowledge-map-check.js

  drift:
    # Opens each worksheet's live exhibit and confirms every control it names is still
    # there. A missing one fails this job and opens an issue naming the worksheet. It
    # reports drift after a lab has published; it cannot block the lab's deploy.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      # apt here is a network dependency on a mirror this runner sometimes cannot
      # resolve. On 2026-11-11 three runs died with
      #   Temporary failure resolving 'azure.archive.ubuntu.com'
      # and then timed out against the five-minute bound, blocking #436 on the sibling workflow.
      #
      # Running the job in mcr.microsoft.com/playwright:v1.63.0-noble removes apt
      # entirely and was tried first (run 43058536010). It got further -- the
      # drift and observe stages both passed in it -- but Firefox will not launch
      # as root inside that image, so the issue recheck came back UNREADABLE for
      # every firefox needle. Trading a transient apt fault for a permanent
      # Firefox one is a worse deal, so the image is not used and the engines
      # stay as they were.
      #
      # What is left is to treat a transient resolver failure as transient: retry
      # the whole install a few times with a pause, and give the step enough room
      # that a retry can finish. The bound still exists, so a genuinely stuck apt
      # still fails visibly rather than wedging the job.
      - name: Install browser host libraries, retrying a flaky mirror
        timeout-minutes: 12
        working-directory: tools
        run: |
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium firefox webkit; then
              echo "host libraries installed on attempt $attempt"; exit 0
            fi
            echo "::warning::playwright install-deps failed on attempt $attempt; retrying"
            sleep 20
          done
          echo "::error::playwright install-deps failed three times; the runner could not reach its apt mirror."
          exit 1
      - run: npx playwright install chromium firefox webkit
        working-directory: tools
      - name: Every control a worksheet names is still on its live exhibit
        run: node tools/teach-drift.js --open-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A recorded issue is a claim about a lab, published to instructors on the module
      # page, and it goes stale the way any other figure does: re-derived for the first
      # time on 2026-09-22, three of the four recorded here no longer matched the live
      # page. `if: always()` so a drift failure above cannot hide a stale issue here —
      # the two checks answer different questions and both answers are wanted.
      - name: Every issue a module page publishes still reproduces
        if: always()
        run: node tools/teach-issues.js --open-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
