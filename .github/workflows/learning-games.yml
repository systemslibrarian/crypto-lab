name: Learning games
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: learning-games-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  secret-council:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Exact arithmetic, secrecy and mission checks
        run: node --test tests/secret-council-core.test.mjs tests/council-vault-core.test.mjs tests/key-rush-core.test.mjs
      - run: npm ci
        working-directory: tools
      - run: npx playwright install chromium
        working-directory: tools
      - name: Complete gameplay, accessible controls and responsive layout
        run: node --test --test-timeout=180000 tests/secret-council-browser.test.cjs tests/council-vault-browser.test.cjs tests/key-rush-browser.test.cjs
      - name: Save gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-council-browser
          path: test-results/secret-council/
          if-no-files-found: warn
  merkle-mystery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Hash vectors, adversarial proofs and mission checks
        run: node --test tests/merkle-mystery-core.test.mjs
      - run: npm ci
        working-directory: tools
      - run: npx playwright install chromium
        working-directory: tools
      - name: Campaign, daily mysteries, trust decisions and responsive layout
        run: node --test --test-timeout=180000 tests/merkle-mystery-browser.test.cjs
      - name: Save archive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merkle-mystery-browser
          path: test-results/merkle-mystery/
          if-no-files-found: warn
  quantum-courier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Measurement rules, exact attack probabilities and sample accounting
        run: node --test tests/quantum-courier-core.test.mjs
      - run: npm ci
        working-directory: tools
      - run: npx playwright install chromium
        working-directory: tools
      - name: Campaign, daily flights, learning limits and responsive layout
        run: node --test --test-timeout=180000 tests/quantum-courier-browser.test.cjs
      - name: Save flight screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quantum-courier-browser
          path: test-results/quantum-courier/
          if-no-files-found: warn
  sealed-showdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Commitment vectors, binding, replay rejection and move rules
        run: node --test tests/sealed-showdown-core.test.mjs
      - run: npm ci
        working-directory: tools
      - run: npx playwright install chromium
        working-directory: tools
      - name: Playable lessons, daily challenges, arena and responsive layout
        run: node --test --test-timeout=180000 tests/sealed-showdown-browser.test.cjs
      - name: Save showdown screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sealed-showdown-browser
          path: test-results/sealed-showdown/
          if-no-files-found: warn
