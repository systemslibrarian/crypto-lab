# Advance pins the Dependabot wave left behind, once a week, just after the wave.
#
# WHY THIS EXISTS. A pinned source review records the commit the review was done
# at. Dependabot auto-merge runs weekly in the lab repos and moves every lab's
# HEAD past its pin by bumping package.json and package-lock.json. The deriver
# then reports "dependency manifests or lockfiles changed after a source review"
# for each one. Measured across published snapshots: that category went 19 -> 92
# -> 94 findings in three days, and 92 of the 94 sat on labs whose SOURCE had not
# moved at all. Every one of those is true and none of them is work: the reviewed
# code is byte-identical, only the lockfile moved.
#
# Advancing those pins by hand cleared it once (120 pins, #429). Without this
# workflow it rebuilds to ~90 next week, which is why the backlog kept reopening.
#
# "UNCHANGED-SOURCE ONLY" IS SATISFIED BY CONSTRUCTION, not by a filter added
# here. auto-advance's condition (a) asks tools/moved-substantively.js the same
# question the deriver asks to set reviewFreshness.status, through the same
# module, so eligibility is a strict SUBSET of unchanged-source -- it then also
# requires every anchor LINE to be byte-identical at both commits and every
# name-verified anchor to still resolve at head. Adding a second, separate
# "unchanged-source" test here would be a fourth verifier stricter than the
# deriver, which is the failure mode this fleet has already been bitten by.
#
# TIMING. The wave merges weekly, early Monday UTC: observed on
# crypto-lab-tc26-pair at 2026-11-10T02:37Z and 2026-11-03T01:26Z. 06:00 Monday
# leaves the wave over three hours and still lands before the console's 07:00
# refresh, so the day's first snapshot sees advanced pins rather than ~90 fresh
# findings.
#
# IT OPENS A PULL REQUEST; it never pushes to main. auto-merge is enabled so the
# branch lands only once the repository's own checks pass -- the same gate a
# person gets, not a way around it. If the checks fail the branch simply waits.
name: Advance unchanged-source pins

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC, after the Dependabot wave
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pin-advance
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Only labs that HAVE a pin can be advanced, so only those are cloned: 139
      # rather than the 254 the fleet check needs. Same shallow strategy as
      # fleet.yml -- depth 1, then fetch the pinned commit by SHA, because a
      # depth-1 clone does not contain it and a pin that cannot be read must be
      # reported as unreadable rather than guessed at.
      - name: Clone the pinned labs beside this repo
        run: |
          # EVERY pinned lab, held ones included. Withholding a held clone was
          # tried on run 43040048204 and was worse than the problem: the card
          # writer needs every clone, so the missing one produced a card that
          # disagreed with its own pin and the regeneration step failed with
          # "crypto-lab-lfsr-forge: card review differs". A held pin is now
          # refused by tools/catalog-evidence.js itself, by name and with the
          # owner's reason, which protects every caller rather than this one.
          # Both populations, because this job now has two jobs to do. The pin
          # advance needs the 139 labs with a source-review pin; the exhibit-map
          # anchor check iterates every lab in tools/catalog-exhibits.json, and a
          # lab missing from disk is reported as COULD NOT LOOK rather than
          # silently skipped -- so cloning only the pinned ones would manufacture
          # ~113 unreadable rows that say nothing about any lab.
          node -e '
            const pins = require("./tools/catalog-reviewed.json");
            const maps = require("./tools/catalog-exhibits.json").labs || {};
            const out = new Map();
            for (const [slug, e] of Object.entries(pins))
              if (e && typeof e === "object" && /^[0-9a-f]{40}$/.test(e.commit || "")) out.set(slug, e.commit);
            for (const [slug, m] of Object.entries(maps))
              if (!out.has(slug) && /^[0-9a-f]{40}$/.test(m.commit || "")) out.set(slug, m.commit);
            for (const [slug, sha] of out) console.log(slug + " " + sha);
          ' > /tmp/pinned.txt
          echo "labs to clone (pins + exhibit maps): $(wc -l < /tmp/pinned.txt)"
          cut -d' ' -f1 /tmp/pinned.txt | xargs -P 8 -I{} sh -c \
            'git clone --depth 1 --quiet "https://github.com/systemslibrarian/{}.git" "../{}" \
              || echo "::warning::clone failed: {}"'
          # Make each pinned commit readable in its shallow clone. A fetch that
          # fails leaves the pin unreadable, which auto-advance reports as
          # PIN-UNREADABLE and refuses to advance -- it does not treat an
          # unreadable pin as an unchanged one.
          while read -r slug sha; do
            [ -d "../$slug/.git" ] || continue
            git -C "../$slug" fetch --depth 1 --quiet origin "$sha" 2>/dev/null \
              || echo "::warning::pinned commit unreadable, will be refused: $slug"
          done < /tmp/pinned.txt
          ls -1d ../crypto-lab-* 2>/dev/null | wc -l

      - name: Report what is eligible, before writing anything
        run: node tools/catalog-evidence.js auto-advance | tee /tmp/advance-report.txt

      # The writer re-derives every row at write time and refuses unless it can
      # reproduce the pin file byte for byte. It assigns commit, range, reason
      # and reviewedCommit only -- never `reviewed` and never `note`, because a
      # date and a human sentence are claims about a person having looked.
      - name: Advance the eligible pins
        run: node tools/catalog-evidence.js auto-advance --write

      # Cards carry the review commit too, and tools/catalog-sync.js check fails
      # when a card disagrees with the pin file. Regenerating them from the pins
      # is what keeps that agreement true.
      # Everything generated FROM the pins has to move with them, or the pull
      # request fails the checks that compare them. Learned from #431, which
      # advanced nothing but ruled nineteen cards and still needed both of
      # these: `check` failed first on a stale knowledge-map/catalog.json and
      # then on CATALOG.md. Each file is written by its own tool, never by hand.
      - name: Write the derived card fields from the pins
        run: node tools/catalog-evidence.js write
      - name: Regenerate CATALOG.md from the cards
        run: node tools/catalog-sync.js
      - name: Regenerate the knowledge map from the cards
        run: node tools/knowledge-map-sync.js write

      # Belt and braces: the clone list already withholds held labs, but this
      # asserts the outcome rather than trusting the input. If a held pin ever
      # moves, the run fails instead of opening a PR that quietly carries it.
      - name: Refuse to carry a change to a held pin
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const holds = require("./tools/clone-holds.json");
            const held = (holds.holds || []).map(h => h.repo).filter(Boolean);
            const before = JSON.parse(execFileSync("git", ["show", "HEAD:tools/catalog-reviewed.json"], { encoding: "utf8" }));
            const after = require("./tools/catalog-reviewed.json");
            const moved = held.filter(s => JSON.stringify(before[s]) !== JSON.stringify(after[s]));
            if (moved.length) { console.error("held pin(s) changed: " + moved.join(", ")); process.exit(1); }
            console.log("held pins unchanged: " + (held.join(", ") || "none declared"));
          '

      # The question is whether a PIN moved, not whether any byte moved.
      # Measured on the first run (43038002569): nothing was eligible, yet the
      # regeneration steps still rewrote derived files, so a plain `git diff`
      # said "changed" and the job went on to open a pull request carrying no
      # advance at all. Ask the pin file, and discard the rest when it is quiet.
      # The same wave that moves a pin moves the exhibit maps beside it, and a
      # map that is behind is not a finding about the lab -- it is a reading that
      # has not been redone. tools/catalog-exhibits.js advance records the check
      # that a machine CAN make (the anchored blobs are identical, or their whole
      # diff is a fleet edit named in tools/fleet-edits.json) and leaves `commit`
      # and `reviewed` alone, because those say what a person read and when.
      #
      # It refuses a held clone by name with the owner's own reason, the same way
      # the pin advance above does, so a hold is honoured in both halves of this
      # job rather than in one of them.
      #
      # Deliberately NOT added to fleet-check: a map being behind is the normal
      # state of this fleet, and making the weekly network sweep fail on 119 of
      # them would turn a standing condition into a standing alarm.
      - name: Record the anchored-blob check for maps the wave moved
        id: anchors
        run: |
          node tools/catalog-exhibits.js advance --write | tee /tmp/anchors.txt
          {
            echo '### Exhibit-map anchor refresh'
            echo
            echo '| | |'
            echo '|---|---|'
            for k in 'current (pin or recorded check already at HEAD)' 'writable anchorsUnchangedAt' 'REFUSED (a person must look)' 'COULD NOT LOOK'; do
              v=$(grep -F "$k" /tmp/anchors.txt | sed 's/.*: *//')
              [ -n "$v" ] && echo "| $k | **$v** |"
            done
            echo
            n=$(grep -c '^    REFUSED ' /tmp/anchors.txt || true)
            u=$(grep -c '^    UNREAD ' /tmp/anchors.txt || true)
            echo "Refused: ${n:-0} · could not look: ${u:-0}. A refusal is a lab a person must read, not a failure."
            if [ "${n:-0}" != "0" ]; then echo; echo '<details><summary>refused</summary>'; echo; echo '```'; grep '^    REFUSED ' /tmp/anchors.txt | head -40; echo '```'; echo '</details>'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop quietly when the wave moved no pin
        id: diff
        run: |
          if git diff --quiet -- tools/catalog-reviewed.json tools/catalog-exhibits.json; then
            echo "no pin advanced and no anchor check recorded; discarding regenerated files and stopping" >&2
            git checkout -- .
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # NOT `npm test`: that pulls in the browser suites, which this repository's
      # CI never runs in one job -- they live in their own workflows and each
      # installs chromium first (see learning-games.yml). Running it here failed
      # the first run on `Cannot find module playwright`, which was a fact about
      # this workflow and not about any pin. What guards a pin advance is the
      # scope and writer suites plus the three generated-file checks, so run
      # exactly those and let them be the gate.
      - name: Check what a pin advance can actually break
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --test tests/catalog-teaching-scope.test.cjs tests/auto-advance-write.test.cjs \
                      tests/moved-substantively.test.cjs tests/remove-settles-comment-only.test.cjs
          node --test tests/exhibit-anchors-unchanged.test.cjs
          node tools/catalog-sync.js check
          node tools/knowledge-map-sync.js check
          node tools/tools-sync.js check

      - name: Open a pull request and let the checks decide
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="pins/advance-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/catalog-reviewed.json CATALOG.md index.html knowledge-map/catalog.json tools/catalog-exhibits.json
          n=$(grep -c '^  crypto-lab-' /tmp/advance-report.txt || echo '?')
          git commit -q -m "Advance pins the Dependabot wave left behind" \
            -m "$n lab(s) eligible: nothing substantive moved, every anchor line is byte-identical at both commits, and every name-verified anchor still resolves at head. Opened by .github/workflows/pin-advance.yml; reviewed and note are untouched, so no claim is made that a person looked again." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push -q -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Advance pins the Dependabot wave left behind" \
            --body "$(printf '%s\n' \
              "Weekly follow-up to the Dependabot auto-merge wave." "" \
              "These pins are behind only because a lockfile moved. Eligibility is decided by \`tools/moved-substantively.js\` -- the same module the deriver uses -- plus byte-identity of every anchor line at both commits, so this is a strict subset of \`unchanged-source\`." "" \
              "\`reviewed\` and \`note\` are untouched: advancing a pin is not a claim that anyone looked again." "" \
              "<details><summary>auto-advance report</summary>" "" '```' "$(head -60 /tmp/advance-report.txt)" '```' "</details>" "" \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)")")
          echo "opened $url"
          # It stops here. Turning on auto-merge would give this workflow a
          # standing merge authority on the hub that nobody granted.
          #
          # Note for whoever revisits that: tools/dispatch-sync.js decides what
          # a Dependabot auto-merge job IS by matching the merge subcommand plus
          # the word Dependabot in a step body, and this step body names the
          # Dependabot wave in its title. So enabling it here would also make
          # the hub fail its own census (UNEXPECTED-JOB crypto-lab, autoMergeJobs
          # pinned 254 observed 255) until the census is re-taken. The trade-off
          # is explicit: the weekly rebuild of dependency-change is only
          # prevented once somebody merges this pull request.
