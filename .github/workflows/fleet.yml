# Fleet check: the six checkers that ask GitHub rather than this repository.
#
# These are scheduled because their answers change without anyone committing here — a
# lab can start serving a stale build, be published with no card, or have its branch
# protection altered on a day this repo sees no activity. Every other checker compares
# files that only move when someone moves them, and those run on pull_request.
#
# Weekly rather than daily: each takes 20 to 30 seconds across the fleet, and a daily
# run of six network checks is a lot of noise for a question whose answer moves slowly.
name: Fleet check

on:
  schedule:
    - cron: '41 7 * * 1'   # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-check
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # theme-sync reads every page of every lab, so the labs have to be here. The
      # others ask the API. Cloning the fleet is the slow part of this job, not the
      # checks, which is the other reason it runs weekly rather than daily.
      # gate-sync, dispatch-sync and theme-sync read the labs' own files, so the labs
      # have to be on disk beside this repo, which is where those checkers look. The
      # other three ask the API. Cloning is the slow part of this job, not the checks —
      # the other reason it runs weekly rather than daily. Shallow and parallel; a
      # clone that fails is a warning and a missing lab, which dispatch-census reports
      # by name rather than quietly shrinking anyone's denominator.
      - name: Clone the fleet beside this repo
        run: |
          # The list is every crypto-lab-* repo PLUS anything the census pins that does
          # not carry that prefix. Filtering on the prefix alone left crypto-compare and
          # crypto-counsel uncloned, and dispatch-sync reported them as NOT-CLONED — a
          # finding about this workflow's clone step, reported as if it were about the
          # labs. A checker's denominator is the pin, so the clone has to cover the pin.
          gh repo list systemslibrarian --limit 400 --json name \
            --jq '.[] | select(.name | startswith("crypto-lab-")) | .name' > /tmp/labs.txt
          node -e '
            const c = require("./tools/dispatch-census.json");
            const pinned = new Set();
            for (const v of Object.values(c)) if (Array.isArray(v)) for (const n of v) if (typeof n === "string") pinned.add(n);
            for (const n of [...pinned].sort()) if (!n.startsWith("crypto-lab-") && n !== "crypto-lab") console.log(n);
          ' >> /tmp/labs.txt
          sort -u /tmp/labs.txt -o /tmp/labs.txt
          wc -l < /tmp/labs.txt
          xargs -P 8 -I{} sh -c \
            'git clone --depth 1 --quiet "https://github.com/systemslibrarian/{}.git" "../{}" \
              || echo "::warning::clone failed: {}"' < /tmp/labs.txt
          ls -1d ../crypto-lab-* | wc -l
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Every network-backed checker, then one issue naming all that failed
        run: node tools/fleet-check.js --open-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── protection-census is NOT in this job, and adding it is a credential decision ──
      #
      # It belongs here by every other measure: it asks GitHub, its answer changes with
      # nobody committing, and it is the only thing that notices a lab's branch
      # protection changing. What stops it is the token.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository the workflow runs in. Reading
      # branch protection on a SIBLING repo answers `403 Resource not accessible by
      # integration` — it is not a permissions block that `permissions:` above can lift,
      # because the token has no standing in those repositories at all. The first
      # scheduled run proved it: UNREAD for all 204 labs, filed as a failure.
      #
      # What would fix it, if you decide the credential is worth it:
      #
      #   A fine-grained PAT whose repository access covers every crypto-lab-* repo,
      #   with ONE permission — Administration: Read-only. Branch protection and
      #   repository rulesets both sit under Administration, and read is all the census
      #   needs; it is read-only by construction and has no write path.
      #
      #   A classic PAT works too but wants `repo`, which is far broader than reading
      #   protection — it carries write to code and settings across everything it can
      #   see. Prefer the fine-grained one.
      #
      # Then store it as a repository secret and add a step here:
      #
      #   - name: What protects each lab's default branch
      #     run: node tools/protection-census.js
      #     env:
      #       GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
      #
      # and add it back to CHECKERS in tools/fleet-check.js so its failures join the one
      # issue rather than only failing the job.
      #
      # Until that exists it stays MANUAL — run locally, where your own `gh` auth already
      # has the access — and the generated table in README.md says manual, because a
      # cadence this job cannot deliver is not one to publish.
