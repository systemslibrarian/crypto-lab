# README catalog: README.md's generated tables (Featured, Learning Paths, All Demos)
# and index.html's hero count must match what tools/readme-sync.js produces from the
# cards. No dependencies: the generator is plain Node.
name: README catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Fixture checks exercise the detectors themselves. They do not inspect
      # today's fleet; that remains the separate, clone-backed weekly job.
      # Continue after a failed assertion so every suite produces a result.
      - name: Catalog evidence regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/catalog-evidence.js selftest
      - name: Standards metadata positive and negative controls
        if: ${{ !cancelled() }}
        run: node --test tests/catalog-standards.test.cjs tests/catalog-teaching-scope.test.cjs
      - name: Algorithm evidence positive and negative controls
        if: ${{ !cancelled() }}
        run: node tools/evidence-shape-proof.js
      - name: Dirty clone and torn snapshot controls
        if: ${{ !cancelled() }}
        run: node tools/clone-guard-proof.js
      - name: Workflow gate regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/gate-sync.js selftest
      - name: Gate fixtures preserve real parsing without package execution
        if: ${{ !cancelled() }}
        run: node --test tests/gate-fixtures.test.cjs
      - name: Fleet discovery regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/fleet-sync.js selftest
      - name: Fleet source readability positive and negative controls
        if: ${{ !cancelled() }}
        run: node --test tests/fleet-sync-source.test.cjs tests/sibling-labs.test.cjs
      - name: Deployment regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/deploy-sync.js selftest
      - name: Deployment CLI rejects incomplete evidence
        if: ${{ !cancelled() }}
        run: node --test tests/deploy-report.test.cjs tests/workflow-evidence.test.cjs
      - name: Auxiliary dispatches preserve publisher and merge guards
        if: ${{ !cancelled() }}
        run: node --test tests/dispatch-targets.test.cjs
      - name: Install locked tools for actual configuration controls
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
        working-directory: tools
      - name: Maintainer live and integration evidence controls
        if: ${{ !cancelled() }}
        run: python3 -B -m unittest discover -s audits/fleet-maintenance-2026-10-09/tools -p 'test_*.py' -v
      - name: Corpus freshness regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/corpus-freshness.js selftest
      - name: Demo date regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/lab-dates.js selftest
      - name: Actual Git history content-date positive and negative controls
        if: ${{ !cancelled() }}
        run: node --test tests/lab-dates-history.test.cjs
      - name: Card metadata duplicates and writer ordering
        if: ${{ !cancelled() }}
        run: node --test tests/card-metadata.test.cjs
      - name: Port and fleet denominator regression fixtures
        if: ${{ !cancelled() }}
        run: node tools/port-sync.js selftest
      - name: Tool cadence preserves fixture-only scope
        if: ${{ !cancelled() }}
        run: node --test tests/tools-cadence.test.cjs
      - name: Depth export rejects unreadable discovery and archives
        if: ${{ !cancelled() }}
        run: node --test tests/depth-export.test.cjs tests/depth-manifest.test.cjs tests/depth-partial.test.cjs tests/depth-classifier.test.cjs tests/depth-complete.test.cjs tests/test-invocation.test.cjs tests/catalog-lexer.test.cjs

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: README.md matches the generator's output
        run: node tools/readme-sync.js check
      # The maintenance table is generated too — from each tool's own header and from
      # the workflow job that runs it — so it drifts the same way the demo tables would
      # if nothing checked them.
      - name: README.md's tools table matches the tools
        run: node tools/tools-sync.js check
      # CATALOG.md is generated from the same cards, and its check does a second job:
      # it fails a card that claims to implement an algorithm without a file:line
      # anchor behind the claim. It needs no clones — the evidence is on the card —
      # so the claim and the check travel together in one pull request.
      - name: CATALOG.md matches the cards, and every claim has its evidence
        run: node tools/catalog-sync.js check

      - name: Catalog document structure
        run: node tools/catalog-structure-check.js

      - name: Knowledge map matches its authored sources
        run: node tools/knowledge-map-sync.js check
      - name: Knowledge map freshness and missing-source controls
        run: node --test tests/knowledge-map-sync.test.cjs
      - name: Learning map source relationships and exact Fermat arithmetic
        run: |
          node tests/knowledge-map-model.test.cjs
          node tests/knowledge-map-factor.test.cjs

      # games/ was the only published surface with no checker of its own, and
      # four false player-facing claims survived in it because nothing looked.
      # The selftest runs first: it proves each check still bites against
      # fixtures, so a green `check` below cannot be a check that fires on
      # nothing.
      - name: Game claim checks still bite
        run: node tools/games-sync.js selftest
      - name: Every game states its limits, bridges to an exhibit and pins a theme
        run: node tools/games-sync.js check
