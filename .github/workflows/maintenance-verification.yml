name: Maintenance verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-verification.yml'
      - 'tools/depth-*'
      - 'tools/test-invocation.js'
      - 'tests/depth-*'

# Observation only: no issue writes, merges, Pages environments or deploy actions.
permissions:
  contents: read

concurrency:
  group: maintenance-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Export regression and scope controls
        run: node --test tests/depth-export.test.cjs tests/depth-manifest.test.cjs
      - name: Export complete remote default branches at full SHAs
        id: export
        continue-on-error: true
        run: node tools/depth-audit.js export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare depth report with complete current exports
        id: depth
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: node tools/depth-audit.js check
      - name: Derive depth dimensions for review
        if: steps.export.outcome == 'success'
        run: |
          mkdir -p maintenance-evidence
          node tools/depth-audit.js --json > maintenance-evidence/depth.json
      - name: Derive test invocation coverage for review
        id: invocation
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p maintenance-evidence
          node tools/test-invocation.js --json > maintenance-evidence/test-invocation.json
      - name: Save source manifests and derived evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: default-branch-evidence
          include-hidden-files: true
          path: |
            .scratch/.to-export.tsv
            .scratch/.exported.tsv
            .scratch/.export-failed.tsv
            maintenance-evidence/
      - name: Preserve failed or incomplete outcomes
        if: always()
        env:
          EXPORT: ${{ steps.export.outcome }}
          DEPTH: ${{ steps.depth.outcome }}
          INVOCATION: ${{ steps.invocation.outcome }}
        run: |
          printf 'export=%s depth=%s invocation=%s\n' "$EXPORT" "$DEPTH" "$INVOCATION"
          [ "$EXPORT" = success ] && [ "$DEPTH" = success ] && [ "$INVOCATION" = success ]

  teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: Install browser host libraries with a bounded timeout
        timeout-minutes: 5
        run: npx playwright install-deps chromium firefox webkit
        working-directory: tools
      - name: Install the three recorded browser engines
        run: npx playwright install chromium firefox webkit
        working-directory: tools
      - name: Worksheet controls on live exhibits
        id: drift
        continue-on-error: true
        run: node tools/teach-drift.js
      - name: Recheck published issue notes in all three engines
        id: issues
        continue-on-error: true
        run: |
          mkdir -p maintenance-evidence
          node tools/teach-issues.js --json > maintenance-evidence/teach-issues.json
      - name: Observe AES Modes page-load contacts in Chromium
        id: observe
        continue-on-error: true
        run: |
          mkdir -p maintenance-evidence
          node tools/teach-observe.js https://systemslibrarian.github.io/crypto-lab-aes-modes/ chromium > maintenance-evidence/teach-observe.json
      - name: Save live teaching evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-teaching-evidence
          path: maintenance-evidence/
      - name: Preserve failed or incomplete outcomes
        if: always()
        env:
          DRIFT: ${{ steps.drift.outcome }}
          ISSUES: ${{ steps.issues.outcome }}
          OBSERVE: ${{ steps.observe.outcome }}
        run: |
          printf 'drift=%s issues=%s observe=%s\n' "$DRIFT" "$ISSUES" "$OBSERVE"
          [ "$DRIFT" = success ] && [ "$ISSUES" = success ] && [ "$OBSERVE" = success ]
