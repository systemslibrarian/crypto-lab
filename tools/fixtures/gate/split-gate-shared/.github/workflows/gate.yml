# FIXTURE: one definition, called from both sides. The rule must stay quiet.
name: Gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:a11y
