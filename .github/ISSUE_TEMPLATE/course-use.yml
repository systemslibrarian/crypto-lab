# GENERATED by tools/teach-build.js. Edit the form there, then rerun it.
name: Using Crypto Lab in a course
description: Tell us where and how you use Crypto Lab in teaching. Nothing is listed publicly unless you tick the box.
title: "[Course use] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Please leave out student names and any other personal information about students.
  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Course
      description: Course name or number, if you would like to share it.
  - type: dropdown
    id: level
    attributes:
      label: Course level
      options:
        - "Secondary school"
        - "Community or technical college"
        - "Undergraduate, lower division"
        - "Undergraduate, upper division"
        - "Graduate"
        - "Professional or continuing education"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      multiple: true
      options:
        - "Security & symmetric encryption"
        - "Public-key & signatures"
        - "Key exchange & secure channels"
        - "Post-quantum transition"
        - "Library privacy, for iSchools"
        - "Individual exhibits, not a module"
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: Term
      placeholder: "Spring 2027"
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you use it
      description: Optional. Which exhibits, and whether in class, as homework or as a demonstration.
  - type: checkboxes
    id: listing
    attributes:
      label: Public listing
      options:
        - label: It is OK to list this institution and course publicly as using Crypto Lab.
          required: false
