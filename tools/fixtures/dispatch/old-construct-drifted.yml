name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate must judge PRs too, or Dependabot's bumps arrive with no CI signal
  # and nothing can safely merge them.
  pull_request:
    branches: [main]
  # Required: an auto-merge made with GITHUB_TOKEN raises no push event, so the
  # deploy has to be asked for by hand or by API. See the last job.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress that lets a PR run cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest, incl. spec KATs)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E, theme contract and accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # A pull request is tested, never published -- but anything else that gets
    # here should publish. NOT `== 'push'`: that also skips workflow_dispatch,
    # which silently makes the whole §6.2 mechanism inert, because the dispatch
    # the auto-merge job fires exists precisely to rebuild the site. Verified:
    # the dispatched run built and then skipped this job.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own unit tests, build, theme contract and axe/e2e run went
  # green on the PR.
  dependabot-auto-merge:
    # `needs:` is the whole safety argument -- the gate decides, not the version
    # number. A major that actually breaks this lab fails the gate and the PR
    # stays open for a human.
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for the deploy dispatch below. Without it `gh workflow run`
      # gets HTTP 403 "Resource not accessible by integration", the merged bump
      # never deploys, and the `|| echo ::warning::` fallback keeps the job
      # green -- so the site silently serves a stale build. Observed on this
      # repo's PR #1 before this line was added.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so `deploy` would never
      # run and the site would keep serving the previous build, with no red run
      # anywhere to say so. Ask for it explicitly; a workflow_dispatch through
      # the API is not suppressed. The dispatched run is the same
      # gate-then-deploy pipeline, so a bad merge still ships nothing.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
